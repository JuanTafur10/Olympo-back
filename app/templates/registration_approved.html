<html>
  <body style="font-family: Arial, sans-serif; color:#222; margin:0; padding:0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8fb; padding:30px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="padding:24px; text-align:center; background:#0f1724; color:#fff;">
                <img src="{{ logo_url }}" alt="Ambrosia" style="height:40px; object-fit:contain;" />
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <h2 style="margin-top:0;">Tu cuenta fue aprobada, {{ name }}!</h2>
                <p>Un administrador confirmó tu registro en Olympo. Ya puedes iniciar sesión y empezar a usar la plataforma.</p>
                <p style="margin-top:18px;"><a href="{{ app_url | default('#') }}" style="display:inline-block;padding:10px 16px;background:#1d86ee;color:#fff;border-radius:6px;text-decoration:none;">Iniciar sesión</a></p>
                <hr style="border:none;border-top:1px solid #eee;margin:20px 0;" />
                <p style="color:#666; font-size:13px;">Si no solicitaste esta cuenta, contacta soporte.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 24px; background:#fafafa; color:#888; font-size:12px; text-align:center;">© Olympo</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
