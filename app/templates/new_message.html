<html>
  <body style="font-family: Arial, sans-serif; color:#222; margin:0; padding:0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8fb; padding:30px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
            <tr>
              <td style="padding:18px; text-align:center; background:#0f1724; color:#fff;">
                <img src="{{ logo_url }}" alt="Ambrosia" style="height:34px; object-fit:contain;" />
              </td>
            </tr>
            <tr>
              <td style="padding:20px;">
                <p>Hola {{ name }},</p>
                <p>Has recibido un nuevo mensaje de <strong>{{ sender_name }}</strong>:</p>
                <blockquote style="background:#f7f7f7;padding:12px;border-left:4px solid #ddd;">{{ message_text }}</blockquote>
                {% if chat_link %}
                <p><a href="{{ chat_link }}" style="display:inline-block;padding:8px 12px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;">Abrir chat</a></p>
                {% endif %}
              </td>
            </tr>
            <tr>
              <td style="padding:12px 24px; background:#fafafa; color:#888; font-size:12px; text-align:center;">© Olympo</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
